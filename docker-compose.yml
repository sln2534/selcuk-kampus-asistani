services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # PDF'ler, Chroma indeksi ve anonim istatistikler kalıcı olsun
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  bot:
    build: .
    env_file: .env
    environment:
      API_URL: http://api:8000
    command: python -m app.bot
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
